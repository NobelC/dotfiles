# ~/dotfiles/yazi/.config/yazi/yazi.toml

[manager]
ratio         = [1, 4, 3]
sort_by       = "natural"
sort_sensitive = false
sort_reverse  = false
sort_dir_first = true
linemode      = "none"
show_hidden   = false
show_symlink  = true

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
play = [
    { run = 'mpv "$@"', orphan = true, desc = "MPV" },
    { run = 'vlc "$@"', orphan = true, desc = "VLC" },
]
image = [
    { run = 'imv "$@"', orphan = true, desc = "Image Viewer" },
    { run = 'swayimg "$@"', orphan = true, desc = "Swayimg" },
]
pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Zathura" },
    { run = 'wpspdf "$@"', orphan = true, desc = "WPS PDF" },
]
word = [
    { run = 'wps "$@"', orphan = true, desc = "WPS Writer" },
    { run = 'libreoffice "$@"', orphan = true, desc = "LibreOffice" },
]
excel = [
    { run = 'wps "$@"', orphan = true, desc = "WPS Spreadsheet" },
    { run = 'libreoffice "$@"', orphan = true, desc = "LibreOffice" },
]
archive = [
    { run = 'unar "$@"', orphan = true, desc = "Extract here" },
]
browser = [
    { run = 'firefox "$@"', orphan = true, desc = "Firefox" },
]

[open]
rules = [
    # Text files
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/javascript", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { mime = "application/xml", use = "edit" },
    { mime = "application/yaml", use = "edit" },
    { mime = "application/toml", use = "edit" },
    { mime = "application/x-empty", use = "edit" },
    
    # Images
    { mime = "image/*", use = "image" },
    
    # Videos
    { mime = "video/*", use = "play" },
    
    # Audio
    { mime = "audio/*", use = "play" },
    
    # PDF
    { mime = "application/pdf", use = "pdf" },
    
    # Office documents
    { url = "*.doc", use = "word" },
    { url = "*.docx", use = "word" },
    { url = "*.rtf", use = "word" },
    { url = "*.odt", use = "word" },
    { url = "*.xls", use = "excel" },
    { url = "*.xlsx", use = "excel" },
    { url = "*.ods", use = "excel" },
    { url = "*.ppt", use = "word" },
    { url = "*.pptx", use = "word" },
    { url = "*.odp", use = "word" },
    
    # Archives
    { mime = "application/zip", use = "archive" },
    { mime = "application/gzip", use = "archive" },
    { mime = "application/x-tar", use = "archive" },
    { mime = "application/x-bzip", use = "archive" },
    { mime = "application/x-bzip2", use = "archive" },
    { mime = "application/x-7z-compressed", use = "archive" },
    { mime = "application/x-rar", use = "archive" },
    
    # URLs
    { url = "*.html", use = "browser" },
    { url = "*.htm", use = "browser" },
]

[tasks]
micro_workers    = 10
max_workers      = 5
suppress_preload = false

[plugin]
prepend_previewers = [
    { name = "*.md", run = "glow" },
]

[input]
cursor_blink = false

[which]
timeout      = 1000
show_remaining = true
