# =====================================================================
# HYPRLOCK - Pantalla de bloqueo
# =====================================================================
source = ~/.config/aether/theme/hyprlock.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = true
    placeholder_text = <i>Contraseña...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $font_color
    font_size = 64
    position = 0, 150
    halign = center
    valign = center
}
